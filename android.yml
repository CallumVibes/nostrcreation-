name: Android APK

# Builds a debug APK you can sideload. Run it from the Actions tab
# (workflow_dispatch) or let it run on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 6's Android template targets Java 17. JDK 21 will fail the
      # Kotlin/AGP compatibility check, so pin it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      # The android/ directory is generated, not committed, so recreate it and
      # re-apply the native layer. wire-native.mjs is idempotent.
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/wire-native.mjs

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: hubcast-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
