name: Build APK

# Self-contained APK builder.
#
# The entire project source is embedded in this file as a base64 tarball, so
# this workflow does NOT check out the repository and does not care what else
# the repo contains. Create this one file and run it.
#
# Actions tab -> "Build APK" -> Run workflow. The APK appears at the bottom of
# the run summary under Artifacts, about 5-8 minutes later.

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      # Deliberately no actions/checkout. The source comes from the payload
      # below, which means a broken or half-uploaded repo cannot affect this.
      - name: Unpack embedded project
